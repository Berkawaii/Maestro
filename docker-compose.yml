version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: duzey_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Duzey123!Password
      POSTGRES_DB: DuzeyYardimDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
